name: Refresh NBA scoreboard
on:
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public NBA scoreboard snapshot
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json,urllib.request,datetime,pathlib
          url="https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; research-dashboard/1.0)","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=20) as response:
              raw=response.read(2_000_001)
          if len(raw)>2_000_000: raise ValueError("oversized response")
          source=json.loads(raw)
          games=[]
          for g in source["scoreboard"]["games"]:
              status=int(g["gameStatus"])
              games.append({"home":g["homeTeam"]["teamTricode"],"away":g["awayTeam"]["teamTricode"],"status":{1:"未開賽",2:"進行中",3:"已結束"}.get(status,"未知"),"home_score":g["homeTeam"].get("score") if status in (2,3) else None,"away_score":g["awayTeam"].get("score") if status in (2,3) else None})
          out={"captured_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"games":games,"source":"NBA public scoreboard CDN"}
          pathlib.Path("data/scoreboard.json").write_text(json.dumps(out,ensure_ascii=False,separators=(",",":"))+"\n",encoding="utf-8")
          print("Scoreboard games:",len(games))
          PY
      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scoreboard.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh NBA scoreboard snapshot"
            git push
          fi
