name: Refresh NBA scoreboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_scoreboard.py'
      - 'scripts/result_ledger.py'
      - 'scripts/publish_snapshots.sh'
      - '.github/workflows/scoreboard.yml'
  schedule:
    - cron: '*/15 0-6,20-23 * * *'
    - cron: '13 7-19 * * *'
permissions:
  contents: write
concurrency:
  group: nba-details-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify lightweight result guards
        run: python3 -m unittest discover -s tests -p 'test_result_ledger.py' -v
      - name: Collect identified NBA or ESPN scoreboard
        run: python3 scripts/collect_scoreboard.py
      - name: Settle published forecasts without training or language-model calls
        run: python3 scripts/result_ledger.py --settle-only
      - name: Publish verified result snapshots
        run: bash scripts/publish_snapshots.sh scoreboard.json games.json elo-pregame-ledger.json factor-pregame-ledger.json gbdt-pregame-ledger.json ensemble-pregame-ledger.json market-pregame-ledger.json settlement-status.json
      - name: Request Pages deployment after result refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/dispatches" -f event_type=refresh-pages || true
