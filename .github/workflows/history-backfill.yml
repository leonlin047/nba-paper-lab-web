name: Backfill ten NBA seasons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_history.py'
      - '.github/workflows/history-backfill.yml'
  schedule:
    - cron: '41 4 * * *'
permissions:
  contents: write
concurrency:
  group: nba-history-backfill
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public NBA HTML parser for offline fixture tests
        run: python3 -m pip install --disable-pip-version-check 'beautifulsoup4>=4.12,<5' -r scripts/requirements-candidate.txt
      - name: Test ESPN event shape before history fetch
        run: python3 -m unittest discover -s tests -v
      - name: Fetch ten-season regular and postseason game results
        env:
          NBA_HISTORY_BATCH_SOURCES: '650'
        run: python3 scripts/backfill_history.py
      - name: Integrity audit
        run: |
          python3 -m unittest discover -s tests -v
          python3 - <<'PY'
          import json
          d=json.load(open('data/history_status.json'))
          assert 2017 in d['years'] and 2026 in d['years']
          if d['complete']:
              assert d['game_count'] >= 6000
          assert not (d['complete'] and d['game_count'] == 0), 'zero-game archive falsely complete'
          print('History coverage:',d['game_count'],'completed source requests',len(d['completed_sources']), '/',d['expected_sources'])
          PY
      - name: Publish history results and coverage status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history_games.json data/history_status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update ten-season NBA history and coverage"
            git pull --rebase
            git push
          fi
      - name: Request Pages refresh
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/dispatches" -f event_type=refresh-pages || true
