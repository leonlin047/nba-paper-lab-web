name: Refresh NBA game details and experimental forecasts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/*.py'
      - 'tests/*.py'
      - 'data/history_games.json'
      - 'research-dashboard.js'
      - 'game-details.js'
      - 'injuries.js'
      - 'news.js'
      - 'localization.js'
      - 'localization-extra.js'
      - 'index.html'
      - '.github/workflows/game-details.yml'
  schedule:
    - cron: '27 * * * *'
permissions:
  contents: write
concurrency:
  group: nba-details-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch attributable news headlines (not X posts)
        run: python3 scripts/collect_news.py
      - name: Fetch game details and pregame baseline
        run: python3 scripts/collect_games.py
      - name: Probe public Taiwan odds source availability
        run: python3 scripts/playsport_probe.py
      - name: Validate datasets and UI syntax
        run: |
          python3 -m unittest discover -s tests -v
          node --check research-dashboard.js
          node --check game-details.js
          node --check injuries.js
          node --check localization.js
          node --check localization-extra.js
          node --check news.js
      - name: Commit verified snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json data/research.json data/playsport_status.json data/injuries.json data/reports.json data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh NBA game details and experimental forecasts"
            git pull --rebase
            git push
          fi
      - name: Request Pages deployment after data refresh
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/dispatches" -f event_type=refresh-pages || true
