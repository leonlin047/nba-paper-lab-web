name: Refresh NBA game details and experimental forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
permissions:
  contents: write
concurrency:
  group: nba-details-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch game details and pregame baseline
        run: python3 scripts/collect_games.py
      - name: Commit verified snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json data/research.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh NBA game details and experimental forecasts"
            git pull --rebase
            git push
          fi
      - name: Request Pages deployment after data refresh
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/dispatches" -f event_type=refresh-pages || true
