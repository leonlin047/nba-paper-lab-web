<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">以球入場，以書立身</title><desc id="desc">五位穿黑西裝與英式平頂帽的人物，在籃球場上並肩出現；有人捧著籃球，有人拿著書，中央人物同時帶著兩者。</desc>
<style>.arrival{animation:arrive 1.15s cubic-bezier(.2,.7,.2,1) both}.a2{animation-delay:.13s}.a3{animation-delay:.26s}.a4{animation-delay:.39s}.a5{animation-delay:.52s}.court-line{stroke-dasharray:1300;stroke-dashoffset:1300;animation:draw 1.7s .15s ease forwards}.ball{transform-box:fill-box;transform-origin:center;animation:ball-settle 1.5s ease both}.book{transform-box:fill-box;transform-origin:center;animation:book-settle 1.2s ease both}@keyframes arrive{from{opacity:0;transform:translateY(35px)}to{opacity:1;transform:translateY(0)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes ball-settle{from{transform:rotate(-18deg)}to{transform:rotate(0)}}@keyframes book-settle{from{transform:rotate(5deg)}to{transform:rotate(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.court-line{stroke-dashoffset:0}}</style>
